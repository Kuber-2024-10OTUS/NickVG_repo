---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.roleBindingMon.metadata.name }}
  namespace: {{ .Release.Namespace }}
subjects:
# You can specify more than one "subject"
- kind: ServiceAccount
  name: {{ .Values.roleBindingMon.subjects.name }} # "name" is case sensitive
  namespace: homework #{{ .Release.Namespace }}
roleRef:
  # "roleRef" specifies the binding to a Role / ClusterRole
  kind: ClusterRole #this must be Role or ClusterRole
  name: {{ .Values.roleBindingMon.roleRef.name }} # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.roleBindingCd.metadata.name }}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.roleBindingCd.subjects.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.roleBindingCd.roleRef.name }}
  apiGroup: rbac.authorization.k8s.io
