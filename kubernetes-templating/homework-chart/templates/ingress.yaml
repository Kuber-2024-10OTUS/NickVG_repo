apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Namespace }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Эта аннотация будет работать только для пути /homepage
    nginx.ingress.kubernetes.io/rewrite-target: / 
#    nginx.ingress.kubernetes.io/rewrite-target: /$2
  labels:
    app: {{ .Values.ingress.metadata.labels.app }}
spec:
  rules:
    - host: {{ .Values.ingress.spec.rules.host }}
      http:
        paths:
          # Путь для всех запросов
          - path: {{ .Values.ingress.spec.rules.http.paths.pathRoot }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.spec.ports.port }}
          # Путь для переписывания /homepage на /
          - path: {{ .Values.ingress.spec.rules.http.paths.pathHomepage }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.spec.ports.port }}
#Второй способ решения без rewrite
#          - path: /homepage
#            pathType: Prefix
#            backend:
#              service:
#                name: homework-service
#                port:
#                  number: 80
