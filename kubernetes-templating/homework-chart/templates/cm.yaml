apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: 2024-12-10T20:52:05Z
  name: {{ .Values.configMap.nameConf }}
  namespace: {{ .Release.Namespace }}
  resourceVersion: "{{ .Release.Revision }}" # задаём версию релиза
  uid: b4952dc3-d670-11e5-8cd0-68f728db1983
data:
  game.properties: |
    enemies=aliens
    lives=3
    enemies.cheat=true
    enemies.cheat.level=noGoodRotten
    secret.code.passphrase=UUDDLRLRBABAS
    secret.code.allowed=true
    secret.code.lives=30    
  ui.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
    how.nice.to.look=fairlyNice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.nameNginx }}
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen {{ .Values.configMap.data.nginxConf.listen_port }} default_server;
        server_name _;

        # Корневая директория для других запросов
        root /homework;

        # Включаем автоиндексацию для других директорий, если нужно
        autoindex on;

        # Обработка запросов по адресу /conf/*
        location /conf/ {
            # Указываем на директорию /homework/conf
            alias /homework/conf/;
            autoindex on;  # Включаем автоиндексацию, если нужно
             }
    }

