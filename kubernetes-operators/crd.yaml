apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mysqls.otus.homework  # Полное имя ресурса
spec:
  group: otus.homework          # Группа API
  names:
    kind: MySQL             # Название ресурса
    listKind: MySQLlist
    plural: mysqls          # Имя во множественном числе
    singular: mysql         # Имя в единственном числе
  scope: Namespaced           # Уровень (Namespaced или Cluster)
  versions:
  - name: v1                  # Версия API
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
               image:
                 type: string
               database: 
                 type: string
               password:
                 type: string
               storage_size:
                 type: string
            required:
              - image
              - database
              - password
              - storage_size

